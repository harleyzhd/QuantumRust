id = "R-SHA1-001"
description = "SHA-1 hashing via the `sha1`, `sha1_checked` and `sha1collisiondetection` crates."

algorithm_class = "Hash"
qv_status = "Deprecated"
nist_tier = "Tier2"

[match]
signatures = [
    "sha1::Sha1::new",
    "sha1::Sha1::digest",
    "sha1::Sha1::new_with_prefix",
    "sha1_checked::Sha1::new",
    "sha1_checked::Sha1::digest",
    "sha1collisiondetection::Builder::build",
]

type_names = ["sha1::Sha1Core", "sha1collisiondetection::Sha1CD"]

[crypto]
primitive = "hash"
algorithm_family = "SHA-1"
crypto_functions = ["digest"]
oid = "1.3.14.3.2.26"
parameter_set_identifier = "SHA-1"
