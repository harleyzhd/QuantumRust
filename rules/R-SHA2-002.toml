id = "R-SHA2-002"
description = "SHA-384 hashing via the `sha2` crate."

algorithm_class = "Hash"
qv_status = "Resistant"
nist_tier = "Tier3"

[match]
signatures = [
    "sha2::Sha384::new",
    "sha2::Sha384::digest",
    "sha2::Sha384::new_with_prefix",
]

type_names = ["sha2::OidSha384", "sha2::Sha384"]

[crypto]
primitive = "hash"
algorithm_family = "SHA-2"
crypto_functions = ["digest"]
oid = "2.16.840.1.101.3.4.2.2"
parameter_set_identifier = "SHA-384"
nist_quantum_security_level = 4
