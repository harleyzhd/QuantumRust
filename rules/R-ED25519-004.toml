id = "R-ED25519-004"
description = "An Ed25519 key or signature identified by type, when the call's symbol names only the generic signing trait."

algorithm_class = "EdDsa"
qv_status = "Vulnerable"
nist_tier = "Tier1"

[match]
type_names = [
    "ed25519_dalek::SigningKey",
    "ed25519_dalek::VerifyingKey",
    "ed25519_dalek::Signature",
    "ed25519::Signature",
]

[crypto]
primitive = "signature"
algorithm_family = "EdDSA"
parameter_set_identifier = "Ed25519"
oid = "1.3.101.112"
nist_quantum_security_level = 0
