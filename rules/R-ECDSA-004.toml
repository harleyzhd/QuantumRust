id = "R-ECDSA-004"
description = "An ECDSA key or signature identified by type, when the call's symbol names only the generic signing trait."

algorithm_class = "Ecdsa"
qv_status = "Vulnerable"
nist_tier = "Tier1"

[match]
type_names = [
    "ecdsa::SigningKey",
    "ecdsa::VerifyingKey",
    "ecdsa::Signature",
    "ecdsa::der::Signature",
]

[crypto]
primitive = "signature"
algorithm_family = "ECDSA"
oid = "1.2.840.10045.2.1"
nist_quantum_security_level = 0

[[parameter_sets]]
identifier = "P-256"
name = "ECDSA-P256"
nist_quantum_security_level = 0
type_names = ["p256::NistP256"]

[[parameter_sets]]
identifier = "P-384"
name = "ECDSA-P384"
nist_quantum_security_level = 0
type_names = ["p384::NistP384"]

[[parameter_sets]]
identifier = "P-521"
name = "ECDSA-P521"
nist_quantum_security_level = 0
type_names = ["p521::NistP521"]

[[parameter_sets]]
identifier = "secp256k1"
name = "ECDSA-secp256k1"
nist_quantum_security_level = 0
type_names = ["k256::Secp256k1"]
