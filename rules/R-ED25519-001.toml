id = "R-ED25519-001"
description = "Ed25519 signing/verifying key generation and import via the `ed25519-dalek` suite."

algorithm_class = "EdDsa"
qv_status = "Vulnerable"
nist_tier = "Tier1"

[match]
signatures = [
    "ed25519_dalek::SigningKey::generate",
    "ed25519_dalek::SigningKey::from_bytes",
    "ed25519_dalek::SigningKey::from_keypair_bytes",
    "ed25519_dalek::SigningKey::verifying_key",
    "ed25519_dalek::VerifyingKey::from_bytes",
    "ed25519_dalek::VerifyingKey::from_public_key_der",
    "ed25519_dalek::VerifyingKey::from_public_key_pem",
    "ed25519::SigningKey::generate",
    "ed25519::SigningKey::from_bytes",
    "ed25519::VerifyingKey::from_bytes",
]

[taint]
sinks = [
    "to_keypair_bytes",
    "as_keypair_bytes",
]

[crypto]
primitive = "signature"
algorithm_family = "EdDSA"
crypto_functions = ["keygen"]
oid = "1.3.101.112"
parameter_set_identifier = "Ed25519"
nist_quantum_security_level = 0
