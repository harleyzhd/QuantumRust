id = "R-OPENSSL-003"
description = "AES-128/192, DES and RC4 via the `openssl` safe bindings."

algorithm_class = "Symmetric"
qv_status = "Deprecated"
nist_tier = "Tier2"

[match]
signatures = [
    "openssl::symm::Cipher::aes_128_gcm",
    "openssl::symm::Cipher::aes_128_cbc",
    "openssl::symm::Cipher::aes_128_ctr",
    "openssl::symm::Cipher::aes_128_ecb",
    "openssl::symm::Cipher::aes_192_gcm",
    "openssl::symm::Cipher::aes_192_cbc",
    "openssl::symm::Cipher::aes_192_ecb",
    "openssl::symm::Cipher::des_cbc",
    "openssl::symm::Cipher::des_ecb",
    "openssl::symm::Cipher::des_ede3",
    "openssl::symm::Cipher::des_ede3_cbc",
    "openssl::symm::Cipher::rc4",
]

[crypto]
primitive = "block-cipher"
algorithm_family = "AES"
crypto_functions = ["encrypt", "decrypt"]
parameter_set_identifier = "AES-128"
nist_quantum_security_level = 1
