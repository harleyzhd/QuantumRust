id = "R-ED25519-002"
description = "Ed25519 signature generation via the `ed25519-dalek` suite."

algorithm_class = "EdDsa"
qv_status = "Vulnerable"
nist_tier = "Tier1"

[match]
signatures = [
    "ed25519_dalek::sign",
    "ed25519_dalek::try_sign",
    "ed25519_dalek::sign_prehashed",
    "ed25519_dalek::try_sign_prehashed",
    "ed25519_dalek::sign_digest",
    "ed25519::sign",
    "ed25519::try_sign",
    "ed25519::sign_prehashed",
]

[taint]
sinks = [
    "sign_prehashed",
    "try_sign_prehashed",
]

[crypto]
primitive = "signature"
algorithm_family = "EdDSA"
crypto_functions = ["sign"]
oid = "1.3.101.112"
parameter_set_identifier = "Ed25519"
nist_quantum_security_level = 0
