id = "R-ED25519-003"
description = "Ed25519 signature verification via the `ed25519-dalek` suite."

algorithm_class = "EdDsa"
qv_status = "Vulnerable"
nist_tier = "Tier1"

[match]
signatures = [
    "ed25519_dalek::verify",
    "ed25519_dalek::verify_strict",
    "ed25519_dalek::verify_prehashed",
    "ed25519_dalek::verify_prehashed_strict",
    "ed25519_dalek::verify_batch",
    "ed25519::verify",
    "ed25519::verify_strict",
]

[crypto]
primitive = "signature"
algorithm_family = "EdDSA"
crypto_functions = ["verify"]
oid = "1.3.101.112"
parameter_set_identifier = "Ed25519"
nist_quantum_security_level = 0
