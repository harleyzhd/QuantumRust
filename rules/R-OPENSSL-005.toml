id = "R-OPENSSL-005"
description = "SHA-1 and MD5 digests via the `openssl` safe bindings."

algorithm_class = "Hash"
qv_status = "Deprecated"
nist_tier = "Tier2"

[match]
signatures = [
    "openssl::sha::sha1",
    "openssl::sha::Sha1::new",
    "openssl::hash::MessageDigest::sha1",
    "openssl::hash::MessageDigest::md5",
    "openssl::hash::MessageDigest::ripemd160",
]

[crypto]
primitive = "hash"
algorithm_family = "SHA-1"
crypto_functions = ["digest"]
oid = "1.3.14.3.2.26"
