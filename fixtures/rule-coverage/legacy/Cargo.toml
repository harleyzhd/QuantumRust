[package]
name = "rule-coverage-legacy"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[workspace]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
camellia = "0.1"
blowfish = "0.9"
des = "0.8"
idea = "0.5"
cast5 = "0.11"
twofish = "0.7"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
blake3 = { version = "1", default-features = false, features = ["pure"] }
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
scrypt = { version = "0.11", default-features = false }
argon2 = "0.5"
sha1collisiondetection = { version = "0.3", default-features = false, features = ["std"] }
