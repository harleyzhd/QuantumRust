[workspace]
resolver = "2"
members = [
    "crates/cpg-core",
    "crates/mir-extract",
    "crates/llvm-extract",
    "crates/callgraph",
    "crates/cpg-fusion",
    "crates/rules",
    "crates/taint",
    "crates/risk",
    "crates/report",
    "crates/quantumrust-cli",
    "xtask",
]
exclude = ["fixtures/demo-crate", "fixtures/multi-crate", "fixtures/dyn-dispatch", "benchmark"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Zhenhao Ding"]
rust-version = "1.75"

[workspace.dependencies]
cpg-core = { path = "crates/cpg-core" }
mir-extract = { path = "crates/mir-extract" }
llvm-extract = { path = "crates/llvm-extract" }
callgraph = { path = "crates/callgraph" }
cpg-fusion = { path = "crates/cpg-fusion" }
qr-rules = { path = "crates/rules" }
qr-taint = { path = "crates/taint" }
qr-risk = { path = "crates/risk" }
qr-report = { path = "crates/report" }

rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petgraph = { version = "0.6", features = ["serde-1"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
