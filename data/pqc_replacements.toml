signature = 16224

[[scheme]]
name = "SLH-DSA-SHA2-256s"
family = "SLH-DSA"
role = "signature"
standard = "FIPS 205"
level = 5
public_key = 64
signature = 29792

# ---------------------------------------------------------------------------
# Classical schemes being replaced. `strength` is classical security in bits
# (NIST SP 800-57 Part 1, Table 2). Sizes as the encoding fixes them: an RSA
# modulus of n bits is n/8 bytes of key and of signature; EC public keys are
# the uncompressed point without the SEC1 prefix byte; ECDSA signatures are r||s.
# A P-521 coordinate takes 66 bytes (521 bits, rounded up). secp256k1 (SEC 2)
# has P-256's sizes and strength.

[[classical]]
name = "RSA-2048"
strength = 112
public_key = 256
signature = 256
ciphertext = 256

[[classical]]
name = "RSA-3072"
strength = 128
public_key = 384
signature = 384
ciphertext = 384

[[classical]]
name = "RSA-4096"
strength = 128
public_key = 512
signature = 512
ciphertext = 512

[[classical]]
name = "ECDSA-P256"
strength = 128
public_key = 64
signature = 64

[[classical]]
name = "ECDSA-P384"
