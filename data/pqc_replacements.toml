# ---------------------------------------------------------------------------
# How each role migrates. Hybrids are named, never selected: whether to run a
# hybrid is a deployment decision, and both constructions are IETF drafts.

[role.signature]
primary = "ML-DSA"
alternative = "SLH-DSA"
alternative_note = "hash-based; signatures 3-7x larger than ML-DSA at the same category (s variants), security resting on the hash alone"
hybrid = "composite ML-DSA + the existing algorithm (IETF draft-ietf-lamps-pq-composite-sigs)"

[role.kem]
primary = "ML-KEM"
hybrid = "X25519MLKEM768, SecP256r1MLKEM768 or SecP384r1MLKEM1024 (IETF draft-ietf-tls-ecdhe-mlkem)"

# ---------------------------------------------------------------------------
# Tier 2: symmetric ciphers and hashes, replaced within their own kind. The
# first option that meets the target level, or that the target profile names
# in its `allow` list, is chosen: SHA-384 under CNSA 2.0, which names it,
# SHA-512 under a bare level-5 floor.

[[upgrade]]
kind = "block cipher"
from = ["AES-128", "AES-192", "TDEA", "Blowfish", "IDEA", "CAST-128", "CAMELLIA", "Camellia-128", "Camellia-192", "Camellia-256"]
to = [{ name = "AES-256", level = 5 }]
standard = "FIPS 197; CNSA 2.0 for the 256-bit bar"

[[upgrade]]
kind = "hash"
from = ["SHA-1", "MD5", "SHA-224", "SHA3-224", "SHA-2", "SHA-3", "BLAKE2", "BLAKE2b", "BLAKE2s", "BLAKE3", "hash"]
to = [{ name = "SHA-256", level = 2 }, { name = "SHA-384", level = 4 }, { name = "SHA-512", level = 5 }]
standard = "FIPS 180-4"

# A stream cipher or AEAD a profile does not name: CNSA 2.0 lists AES-256 and
# not ChaCha20, nor an AEAD whose algorithm the call does not name (`ring`).
# ChaCha20 and AES-256 are both category 5, so nothing replaces ChaCha20
# without a profile.
[[upgrade]]
kind = "AEAD / stream cipher"
from = ["ChaCha20", "ChaCha20-Poly1305", "AEAD"]
to = [{ name = "AES-256", level = 5 }]
standard = "FIPS 197 (AES-256-GCM, SP 800-38D); CNSA 2.0 names AES-256"
