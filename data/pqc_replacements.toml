# PQC replacement table, read by `qr-report::migration` and embedded in the
# binary: what a finding should migrate to, and what that costs in bytes.
#
# - Sizes and security categories come from the standards cited on each row:
#   FIPS 203 (ML-KEM), FIPS 204 (ML-DSA), FIPS 205 (SLH-DSA), and for the
#   classical schemes the size their encoding fixes.
# - Signatures migrate to ML-DSA (SLH-DSA as the conservative alternative) and
#   key establishment to ML-KEM, following NIST IR 8547. The hybrid
#   constructions named are IETF drafts.
# - `default_level` is this project's choice: with no profile floor, a
#   replacement targets NIST category 3. A profile's
#   `min_quantum_security_level` raises it (CNSA 2.0 -> 5), and a classical
#   scheme stronger than category 3 is never downgraded.
#
# Refactoring scope comes from `analyze --refactor-scope` and computational
# cost from `pqc_speed.json`. Protocol impact and infrastructure cost depend on
# the deployment, so the report shows them as "not populated".

# NIST category targeted when no profile sets a floor.
default_level = 3

# Bytes in one Ethernet frame's payload: an exchange that needs more is
# fragmented at the network layer.
mtu_bytes = 1500

# ---------------------------------------------------------------------------
# Post-quantum parameter sets. `level` is the NIST security category the
# standard assigns. Sizes in bytes.

[[scheme]]
name = "ML-KEM-512"
family = "ML-KEM"
role = "kem"
standard = "FIPS 203"
level = 1
public_key = 800
ciphertext = 768

[[scheme]]
name = "ML-KEM-768"
family = "ML-KEM"
role = "kem"
standard = "FIPS 203"
level = 3
public_key = 1184
ciphertext = 1088

[[scheme]]
name = "ML-KEM-1024"
family = "ML-KEM"
role = "kem"
standard = "FIPS 203"
level = 5
public_key = 1568
ciphertext = 1568

[[scheme]]
name = "ML-DSA-44"
family = "ML-DSA"
role = "signature"
standard = "FIPS 204"
level = 2
public_key = 1312
signature = 2420

[[scheme]]
name = "ML-DSA-65"
family = "ML-DSA"
role = "signature"
standard = "FIPS 204"
level = 3
public_key = 1952
signature = 3309

[[scheme]]
name = "ML-DSA-87"
family = "ML-DSA"
role = "signature"
standard = "FIPS 204"
level = 5
public_key = 2592
signature = 4627

# SLH-DSA: the "small" (s) variants, with smaller signatures and slower signing.
[[scheme]]
name = "SLH-DSA-SHA2-128s"
family = "SLH-DSA"
role = "signature"
standard = "FIPS 205"
level = 1
public_key = 32
signature = 7856

[[scheme]]
name = "SLH-DSA-SHA2-192s"
family = "SLH-DSA"
role = "signature"
